<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>慢性腎臟病與透析患者之抗結核藥物劑量調整與臨床藥事照護 | 張綜瑋 藥師</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/white.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary:#3D5A78; --accent:#4E7A5A; --muted:#6B7280;
      --r-background-color:#FDFBF9;
    }
    .reveal { font-family:'Noto Sans TC',sans-serif; }
    .reveal .slides section { text-align:left; }
    .reveal h1,.reveal h2,.reveal h3 { text-transform:none; }

    /* 封面頂部色帶 */
    .reveal .slides section.cover::before {
      content:''; display:block; position:absolute; top:0; left:0; right:0;
      height:5px; background:linear-gradient(90deg,var(--primary) 0%,var(--accent) 100%);
      pointer-events:none;
    }
    .cover-wrap { padding:1.6em 2.2em; position:relative; }
    .cover-title { font-size:1.15em; font-weight:700; color:var(--primary); line-height:1.4; margin:0 0 .15em; }
    .cover-divider { height:1.5px; background:linear-gradient(90deg,var(--primary) 0%,transparent 100%); margin:.35em 0 .55em; width:80%; }
    .cover-meta { font-size:.5em; color:var(--muted); margin-bottom:1.1em; }
    .cover-meta span { margin:0 .5em; }
    .presenter-card { display:inline-flex; align-items:center; gap:16px; background:#fff; border:1px solid #D8E0E8; border-radius:12px; padding:14px 20px; box-shadow:0 2px 10px rgba(61,90,120,.08); }
    .presenter-card img { width:62px; height:62px; border-radius:50%; object-fit:cover; border:2px solid #C8D5DF; }
    .presenter-name { font-size:.62em; font-weight:700; color:var(--primary); }
    .presenter-org { font-size:.46em; color:var(--muted); line-height:1.6; margin-top:2px; }
    .presenter-org strong { color:var(--accent); }
    .cover-foot { position:absolute; bottom:0; left:0; right:0; height:26px; background:#F0ECE8; border-top:1px solid #DDD5CC; display:flex; align-items:center; padding:0 1.2em; font-size:.34em; color:var(--muted); }
    .cover-foot span { margin:0 .5em; }

    /* 整頁嵌圖 */
    .reveal .slides section.imgslide { padding:0; }

    .reveal .progress { height:3px; color:var(--accent); }
    .reveal .controls { color:var(--primary); }
    .reveal .slide-number { color:var(--muted); font-size:.4em; }
  </style>
</head>
<body>
<div class="reveal">
  <div class="slides">

<!-- 封面 -->
<section class="cover" data-background-color="#FDFBF9">
  <div class="cover-wrap">
    <h1 class="cover-title">慢性腎臟病與透析患者之抗結核藥物<br>劑量調整與臨床藥事照護</h1>
    <div class="cover-divider"></div>
    <p class="cover-meta">115年6月臨床藥學會雲嘉區雙月會 <span>|</span> 115年06月</p>
    <div class="presenter-card">
      <img src="assets/avatar.jpg" alt="張綜瑋 藥師" onerror="this.style.display='none'">
      <div>
        <div class="presenter-name">張綜瑋 藥師</div>
        <div class="presenter-org">
          彰化基督教醫療財團法人 員林基督教醫院<br>
          嘉南藥理大學 藥學系 <strong>兼任講師</strong>
        </div>
      </div>
    </div>
  </div>
  <div class="cover-foot">
    慢性腎臟病與透析患者之抗結核藥物劑量調整與臨床藥事照護
    <span>|</span> 115年6月臨床藥學會雲嘉區雙月會 <span>|</span> 張綜瑋 藥師
  </div>
</section>
