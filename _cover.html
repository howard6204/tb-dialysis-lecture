<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1280px;height:720px;overflow:hidden;}
  /* ── 封面（複刻 slides.html .cover，font-size 42px = reveal white 主字級） ── */
  .cover{
    font-family:'Noto Sans TC',sans-serif;
    font-size:42px;
    background:#FDFBF9;
    position:relative;
    width:1280px;height:720px;
    display:flex;flex-direction:column;justify-content:center;
    padding:0 70px;text-align:left;
  }
  .cover::before{
    content:'';position:absolute;top:0;left:0;right:0;height:6px;
    background:linear-gradient(90deg,#3D5A78 0%,#4E7A5A 100%);
  }
  .cover-title{
    color:#3D5A78;font-size:1.5em;font-weight:700;line-height:1.35;
    margin:0 0 16px;letter-spacing:.01em;white-space:nowrap;
  }
  .cover-divider{height:1px;width:100%;background:#D8D2CC;margin:0 0 18px;}
  .cover-sub{color:#6B7280;font-size:1.05em;font-weight:400;margin:0 0 16px;}
  .cover-meta{color:#8A8580;font-size:.6em;margin:0 0 30px;}
  .cover-meta span{margin:0 .6em;color:#C8C2BC;}
  .presenter-card{
    display:flex;align-items:center;gap:20px;width:fit-content;
    padding:16px 24px;background:#fff;
    border:1px solid #E5E0DB;border-radius:14px;
    box-shadow:0 2px 12px rgba(61,90,120,.06);
  }
  .presenter-card img{
    width:72px;height:72px;border-radius:50%;object-fit:cover;
    border:2px solid #E0DAD3;flex-shrink:0;
  }
  .presenter-info{color:#5A5550;font-size:.62em;line-height:1.7;}
  .presenter-info strong{color:#3D5A78;font-size:1.05em;}
</style>
</head>
<body>
<section class="cover">
  <h1 class="cover-title">慢性腎臟病與透析患者之抗結核藥物</h1>
  <div class="cover-divider"></div>
  <div class="cover-sub">劑量調整與臨床藥事照護</div>
  <div class="cover-meta">115年6月臨床藥學會雲嘉區雙月會 <span>｜</span> 6月25日</div>
  <div class="presenter-card">
    <img src="assets/avatar.jpg" alt="張綜瑋 藥師">
    <div class="presenter-info">
      <strong>張綜瑋 藥師</strong><br>
      彰化基督教醫療財團法人 員林基督教醫院 藥劑課<br>
      嘉南藥理大學 藥學系 <strong>兼任講師</strong>
    </div>
  </div>
</section>
</body>
</html>
